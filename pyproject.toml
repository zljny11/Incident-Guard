[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-guard"
version = "0.1.0"
description = "Event-driven agent harness for auditable incident investigation and recovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Incident Guard contributors" },
]
dependencies = [
    "jsonschema>=4.19,<5",
    "mcp>=2.1,<3",
    "starlette>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "langgraph>=1.0,<2",
    "pytest>=8,<10",
]
baseline = [
    "langgraph>=1.0,<2",
]

[project.scripts]
ig = "incident_guard.cli:main"

[tool.setuptools.packages.find]
include = ["incident_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a running local Docker daemon",
]
